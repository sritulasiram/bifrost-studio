# Optional maintainer pipeline: signed release DMG and Apple notarization (Phase 3).
# Does not run on ordinary PRs — use workflow_dispatch or version tags.
name: Release and notarize

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: "Submit DMG to Apple notarization after build"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  LIBUSB_VERSION: "1.0.29"
  LIBUSB_SHA256: "5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85"

jobs:
  release:
    name: Build, sign, and notarize
    runs-on: macos-15
    if: ${{ secrets.BIFROST_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --always | sed 's/^v//')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Install CMake
        run: brew install cmake

      - name: Cache libusb
        id: libusb-cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: libusb-${{ env.LIBUSB_VERSION }}-universal-${{ env.LIBUSB_SHA256 }}

      - name: Build universal libusb
        if: steps.libusb-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o libusb.tar.bz2 \
            "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"
          echo "${LIBUSB_SHA256}  libusb.tar.bz2" | shasum -a 256 -c -
          tar xjf libusb.tar.bz2
          cd "libusb-${LIBUSB_VERSION}"
          ./configure --enable-static --enable-shared --prefix="$HOME/.local" \
            CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=13.0 -O2"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.BIFROST_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.BIFROST_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/signing.p12" -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Configure and build
        env:
          BIFROST_TEAM_ID: ${{ secrets.BIFROST_TEAM_ID }}
          BIFROST_SIGN_IDENTITY: ${{ secrets.BIFROST_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBUSB_ROOT="$HOME/.local" \
            -DBIFROST_TEAM_ID="$BIFROST_TEAM_ID" \
            -DBIFROST_BUNDLE_ID="${{ vars.BIFROST_BUNDLE_ID || 'studio.bifrost.macos' }}"
          cmake --build build -j"$(sysctl -n hw.ncpu)" --target BifrostStudio
          chmod +x packaging/*.sh scripts/*.sh
          ./scripts/check-l10n.sh
          ctest --test-dir build --output-on-failure

      - name: Sign and package DMG
        env:
          BIFROST_SIGN_IDENTITY: ${{ secrets.BIFROST_SIGN_IDENTITY }}
          BIFROST_TEAM_ID: ${{ secrets.BIFROST_TEAM_ID }}
        run: |
          set -euo pipefail
          export BIFROST_SIGN_IDENTITY BIFROST_TEAM_ID
          ./packaging/release.sh build "${{ steps.ver.outputs.version }}"
          ./packaging/preflight-release.sh build

      - name: Notarize (optional)
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.notarize == true)
        env:
          NOTARY_KEY_ID: ${{ secrets.BIFROST_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.BIFROST_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.BIFROST_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ] || [ -z "$NOTARY_KEY_P8" ]; then
            echo "Notary API secrets missing; skipping notarization." >&2
            exit 0
          fi
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$KEY"
          DMG="build/BifrostStudio-${{ steps.ver.outputs.version }}.dmg"
          export BIFROST_NOTARY_KEY_ID BIFROST_NOTARY_ISSUER_ID
          export BIFROST_NOTARY_KEY_PATH="$KEY"
          BIFROST_STAPLE_APP="build/Bifrost Studio.app" ./packaging/notarize.sh "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: BifrostStudio-${{ steps.ver.outputs.version }}-dmg
          path: build/BifrostStudio-${{ steps.ver.outputs.version }}.dmg
          if-no-files-found: error